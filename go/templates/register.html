{{define "register"}}<section class="panel auth-panel"><input type="hidden" name="csrfToken" value="{{.CSRF}}"><h2>Регистрация</h2><form method="post" action="/account/register"><label>Имя<input name="displayName" required></label><label>Email<input name="email" type="email" required></label><label>Пароль<input name="password" type="password" minlength="12" required></label><button type="submit">Создать аккаунт</button></form></section>{{end}}
